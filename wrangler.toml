name = "pontaj-practica-api"
main = "worker/index.js"
compatibility_date = "2026-03-03"

# Primary datastore (per-record rows; atomic writes).
[[d1_databases]]
binding = "DB"
database_name = "pontaj-practica-db"
database_id = "49582271-4d00-4574-8010-1027f4bdcfde"

# Legacy store, kept only for the one-time KV -> D1 import.
[[kv_namespaces]]
binding = "DB_KV"
id = "2c00d0baf95c462a906c0f1c91e35d29"

[triggers]
crons = ["*/10 * * * *"]
